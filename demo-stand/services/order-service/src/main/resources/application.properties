spring.application.name=order-service
server.port=8082

# Ошибки в формате RFC 9457 (application/problem+json), одинаково для всех случаев
spring.mvc.problemdetails.enabled=true

# Адрес сервиса каталога
catalog.url=http://localhost:8081

# Трассировка: спаны уходят по OTLP (HTTP), метрики и логи не экспортируются
otel.exporter.otlp.endpoint=http://localhost:4318
otel.metrics.exporter=none
otel.logs.exporter=none
