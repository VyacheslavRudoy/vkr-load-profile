# Единый вход стенда для планов нагрузочного теста: каталог и заказы
# живут на разных портах, а JMeter-план адресуется одному адресу.
events {
    # при 200+ одновременных соединений JMeter дефолта в 1024 мало
    worker_connections 4096;
}

http {
    server {
        listen 8080;

        location /api/products {
            proxy_pass http://catalog-service:8081;
        }

        location /api/orders {
            proxy_pass http://order-service:8082;
        }
    }
}
