# Демонстрационный стенд целиком: оба сервиса, шлюз, коллектор OpenTelemetry,
# Jaeger и база профилей. Сервисы собираются из jar-файлов, поэтому сначала
# ./mvnw verify в корне репозитория, затем docker compose up --build --detach --wait.
services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway.conf:/etc/nginx/nginx.conf:ro
    ports:
      # внешний порт 18080: на 127.0.0.1:8080 у разработчиков часто сидит свой сервис,
      # а Java-клиенты ходят по IPv4 и попадают не в шлюз
      - "18080:8080"
    depends_on:
      - catalog-service
      - order-service

  catalog-service:
    build: demo-stand/services/catalog-service
    ports:
      - "8081:8081"
    environment:
      # куча JVM явью: дефолт берёт четверть контейнера и при высоких
      # нагрузках бывает тесно
      JAVA_TOOL_OPTIONS: "-Xmx512m"
      # Адрес коллектора из application.properties (localhost) здесь не подходит:
      # внутри compose каждый сервис — отдельный хост
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      - otel-collector
      - jaeger
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  order-service:
    build: demo-stand/services/order-service
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"
      CATALOG_URL: http://catalog-service:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      - otel-collector
      - jaeger
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector:0.161.0
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector/config.yaml:ro
    ports:
      - "4318:4318"

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # внешний порт 15432: стандартный 5432 часто занят локальной базой
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profile"]
      interval: 5s
      timeout: 3s
      retries: 10
