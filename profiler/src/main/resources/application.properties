# Приложение работает как утилита командной строки, а не как сервис:
# баннер и сообщения о запуске только мешают читать вывод команд.
spring.main.banner-mode=off
spring.main.log-startup-info=false
spring.main.web-application-type=none

# Версию подставляет Maven при обработке ресурсов (значение из pom.xml).
profiler.version=@project.version@
