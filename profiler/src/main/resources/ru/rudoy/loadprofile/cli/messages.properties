# Переводы встроенных строк picocli: заголовки разделов справки и описания
# стандартных параметров -h/--help и -V/--version.
# Описания команд и их параметров задаются в аннотациях, а не здесь.
# Пробел в конце заголовка записан как \u0020, чтобы его не удалил редактор.
usage.synopsisHeading=Использование:\u0020
usage.optionListHeading=%nПараметры:%n
usage.commandListHeading=%nКоманды:%n
mixinStandardHelpOptions.help=Показать эту справку и выйти.
mixinStandardHelpOptions.version=Показать версию и выйти.
